<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Login Section -->
        <section id="auth-section">
            <div class="card">
                <h2 id="auth-title">Login</h2>
                <form id="auth-form">
                    <div class="form-group" id="name-group" style="display: none;">
                        <label>Name</label>
                        <input type="text" id="name" placeholder="Enter name">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" required placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required placeholder="Enter password">
                    </div>
                    <div class="form-group" id="role-group" style="display: none;">
                        <label>Role</label>
                        <select id="role">
                            <option value="Member">Member</option>
                            <option value="Admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" id="auth-btn">Login</button>
                </form>
                <p id="toggle-auth">Don't have an account? <span>Signup</span></p>
            </div>
        </section>

        <!-- Main App Section (Dashboard) -->
        <section id="main-section" style="display: none;">
            <nav>
                <h1>Team Task Manager</h1>
                <div class="nav-links">
                    <span id="user-name"></span>
                    <button id="logout-btn">Logout</button>
                </div>
            </nav>

            <div class="container">
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <h3>Total Tasks</h3>
                        <p id="total-tasks">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>To Do</h3>
                        <p id="todo-tasks">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>In Progress</h3>
                        <p id="progress-tasks">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>Completed</h3>
                        <p id="completed-tasks">0</p>
                    </div>
                    <div class="stat-card overdue">
                        <h3>Overdue</h3>
                        <p id="overdue-tasks">0</p>
                    </div>
                </div>

                <div class="content-grid">
                    <div class="projects-section">
                        <div class="section-header">
                            <h2>Projects</h2>
                            <button id="add-project-btn" class="admin-only">Add Project</button>
                        </div>
                        <div id="projects-list"></div>
                    </div>

                    <div class="tasks-section">
                        <div class="section-header">
                            <h2>Tasks</h2>
                            <button id="add-task-btn" class="admin-only">Add Task</button>
                        </div>
                        <div id="tasks-list"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Modals -->
        <div id="project-modal" class="modal">
            <div class="modal-content">
                <h2>Add Project</h2>
                <form id="project-form">
                    <input type="text" id="p-name" placeholder="Project Name" required>
                    <textarea id="p-desc" placeholder="Description"></textarea>
                    <button type="submit">Create Project</button>
                    <button type="button" class="close-modal">Cancel</button>
                </form>
            </div>
        </div>

        <div id="task-modal" class="modal">
            <div class="modal-content">
                <h2>Add Task</h2>
                <form id="task-form">
                    <input type="text" id="t-title" placeholder="Task Title" required>
                    <textarea id="t-desc" placeholder="Description"></textarea>
                    <select id="t-project" required></select>
                    <input type="date" id="t-date">
                    <button type="submit">Create Task</button>
                    <button type="button" class="close-modal">Cancel</button>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
